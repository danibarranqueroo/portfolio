# ---------------------------------------------------------------------------
# Supply-chain policy.
# These settings live here, not in .npmrc — pnpm moved them in v10.
# Rationale for each is in docs/DECISIONS.md.
# ---------------------------------------------------------------------------

# Refuse to resolve any version published within the last 7 days (in minutes).
# pnpm 11 defaults to 1440 (24h); we are deliberately stricter. Nearly every
# npm compromise of recent years was caught and yanked well inside a week, so
# this quarantine means a poisoned release expires before we could install it.
minimumReleaseAge: 10080

# Save exact versions. No ^ or ~ anywhere in package.json, ever.
savePrefix: ''

# If a dependency wants to run an install script and is not allowlisted below,
# fail the install loudly instead of silently skipping it.
strictDepBuilds: true

# Refuse to run any script against a stale node_modules.
verifyDepsBeforeRun: install

# ---------------------------------------------------------------------------
# The ONLY packages permitted to execute install scripts. Every entry is a
# deliberate decision, not a convenience. Adding to this list is a security
# decision and belongs in a reviewed commit.
# ---------------------------------------------------------------------------
allowBuilds:
  # Native binary fetched at install; required by Vite, which Astro builds on.
  esbuild: true
  # Downloads its own Go binary. First-party tool we chose for git hooks.
  lefthook: true
  # Native image processing. Used by astro:assets for image optimisation.
  sharp: true
