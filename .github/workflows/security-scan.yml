name: Prowler scan

# Audits this repository's own GitHub configuration and commits the normalized
# result, which the site renders on /security.
#
# Needs a fine-grained PAT in the PROWLER_GITHUB_TOKEN secret with repository
# permissions Administration:Read, Contents:Read, Metadata:Read and Dependabot
# alerts:Read. The built-in GITHUB_TOKEN cannot read branch protection or
# security settings, so it is not sufficient.

on:
  schedule:
    # Monday 06:00 UTC, a little before the Renovate window.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prowler-scan
  cancel-in-progress: false

jobs:
  scan:
    name: scan and publish findings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Elevated only here, and only for the commit step. The workflow default
    # above stays read-only.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check the scan token exists
        id: token
        env:
          PROWLER_GITHUB_TOKEN: ${{ secrets.PROWLER_GITHUB_TOKEN }}
        run: |
          if [ -z "$PROWLER_GITHUB_TOKEN" ]; then
            echo "::warning::PROWLER_GITHUB_TOKEN is not set — skipping the scan."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.token.outputs.present == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Run Prowler
        if: steps.token.outputs.present == 'true'
        env:
          # Prowler talks only to api.github.com. The token is never written to
          # disk or into the committed output.
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.PROWLER_GITHUB_TOKEN }}
        run: |
          # Pinned exactly, like every other dependency here.
          uv tool install --python 3.12 prowler@5.42.0
          uv tool run --from prowler@5.42.0 prowler github \
            --repository "${{ github.repository }}" \
            --output-formats json-ocsf \
            --output-directory ./prowler-output \
            --output-filename scan \
            || true   # Prowler exits 3 when it finds anything; that is expected.

      - name: Install Node
        if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Normalize the report
        if: steps.token.outputs.present == 'true'
        run: node scripts/normalize-prowler.mjs ./prowler-output/scan.ocsf.json

      - name: Commit the result if it changed
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- src/data/security-scan.json; then
            echo "Posture unchanged; nothing to commit."
            exit 0
          fi

          # Committed through the REST API rather than `git push`: main requires
          # signed commits, and commits created via the API are signed by
          # GitHub. A plain push from Actions is unsigned and would be rejected.
          sha=$(gh api "repos/${{ github.repository }}/contents/src/data/security-scan.json" \
                  --jq '.sha' 2>/dev/null || echo "")
          gh api "repos/${{ github.repository }}/contents/src/data/security-scan.json" \
            -X PUT \
            -f message="chore: refresh Prowler scan results" \
            -f content="$(base64 -w0 src/data/security-scan.json)" \
            ${sha:+-f sha="$sha"} \
            --jq '.commit.html_url'
