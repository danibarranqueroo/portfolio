<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" role="img" aria-label="D">
  <!--
    A solid tile rather than a bare letterform, deliberately. A favicon is
    drawn at 16px onto a tab strip whose colour we do not control, so a shape
    carrying its own background reads the same on a light tab, a dark tab, a
    bookmark bar and a phone home screen. The bare letter tested noticeably
    weaker at 16px against a dark tab.

    The fill is the brand purple, the accent fill token in global.css. Note
    that token names are spelled without their leading dashes here: an XML
    comment may not contain two consecutive hyphens, and writing them cost an
    afternoon of a favicon that silently refused to parse.

    width and height are set alongside viewBox on purpose. Without an
    intrinsic size the file cannot be rasterised through an Image, which is
    how favicon.ico is generated from it.
  -->
  <rect width="100" height="100" rx="22" fill="#7f00e0"/>
  <path fill="#fff" fill-rule="evenodd"
        d="M28 24h22a26 26 0 0 1 0 52H28Zm13 12v28h9a14 14 0 0 0 0-28Z"/>
</svg>
